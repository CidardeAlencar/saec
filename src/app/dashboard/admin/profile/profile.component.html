<div class="main">
  <!-- <img src="images/compas.png" alt="Escudo EMTE" class="compas"> -->
  <div class="container">
    <h1>REGISTRO DEL ESTUDIANTE</h1>
    <form>
      <mat-form-field appearance="outline">
        <mat-label>C.I.</mat-label>
        <input
          matInput
          placeholder="6147015"
          [formControl]="ci"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Nombres</mat-label>
        <input
          matInput
          placeholder="Ruddy Gerardo"
          [formControl]="nombres"
          (keydown.enter)="preventSubmit($event)"
          />
          <!-- <button
            style="border-radius: 20px; margin: 10px;"
            mat-icon-button
            matSuffix
            type="button"
            (click)="buscar()"
            [attr.aria-label]="'search'"
          >
            <mat-icon>search</mat-icon>
          </button> -->
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Apellido paterno</mat-label>
        <input
          matInput
          placeholder="Flores"
          [formControl]="apellidoPaterno"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Apellido materno</mat-label>
        <input
          matInput
          placeholder="Herrera"
          [formControl]="apellidoMaterno"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Celular</mat-label>
        <input
          matInput
          placeholder="77777777"
          [formControl]="celular"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
      <!-- <mat-form-field appearance="outline">
        <mat-label>Grado</mat-label>
        <input
          matInput
          placeholder="Sof"
          [formControl]="ci"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field> -->
      <mat-form-field appearance="outline">
        <mat-label>Grado</mat-label>
        <mat-select [formControl]="grado">
          <mat-option value="Al. 1er. AM.">Al. 1er. AM.</mat-option>
          <mat-option value="Al. 2do. AM.">Al. 2do. AM.</mat-option>
          <mat-option value="Al. 3er. AM.">Al. 3er. AM.</mat-option>
          <mat-option value="Al. 2do.">Al. 2do.</mat-option>
          <mat-option value="Al. 1ro.">Al. 1ro.</mat-option>
          <mat-option value="Al. My.">Al. My.</mat-option>
          <!-- grados faltan -->
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Correo electronico</mat-label>
        <input
          matInput
          placeholder="ninjaneja@gmail.com"
          [formControl]="correo"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          placeholder="1234pdPD"
          [formControl]="contrasena"
          (keydown.enter)="preventSubmit($event)"
          />
      </mat-form-field>
    </form>
    <button
        mat-raised-button
        class="button-primary button-register"
        (click)="registerStudent()">
        REGISTRAR
      </button>
  </div>
  <!-- <img src="images/libroAzul.png" alt="Escudo EMTE" class="letra"> -->
</div>
